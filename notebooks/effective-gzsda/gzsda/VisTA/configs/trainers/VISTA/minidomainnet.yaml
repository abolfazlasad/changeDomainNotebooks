DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 8
  TRAIN_U:
    BATCH_SIZE: 8
  TEST:
    BATCH_SIZE: 128
  NUM_WORKERS: 4

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "random_flip", "normalize"]

OPTIM:
  NAME: "sgd"
  LR: 3e-3
  MAX_EPOCH: 10
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "linear"
  WARMUP_MIN_LR: 1e-5

TRAIN:
  PRINT_FREQ: 100
  COUNT_ITER: "smaller_one"
  PER: 20

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  VISTA:
    PREC: "amp"
    DEBIASPL: true
    GAMMA: 0.7
    TAU: 0.5
    L: 5
    N: 8
    M: 10
    LAM_1: 25.0
    LAM_2: 20.0
    LAM_3: 1.0